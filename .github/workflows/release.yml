name: release

# Builds the signed NSIS installer + updater manifest (latest.json) and attaches
# them to a draft GitHub Release. Publish the draft to make the release visible
# to the in-app updater - `releases/latest` never serves drafts or prereleases.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           - content of ~/.tauri/doccraft.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  - only if the key has a password
#
# See docs/design/00021_auto-download-install.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the bundled version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tauri.conf.json version: $version"

      # The updater compares versions, so a tag that disagrees with the bundle
      # version would ship an artifact the app believes it already has.
      - name: Fail when the tag does not match the bundle version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag $GITHUB_REF_NAME != tauri.conf.json version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The release notes double as the `notes` field of latest.json, which is
      # what the in-app update dialog renders - so they come from the checked-in
      # changelog rather than a hard-coded string. Everything above the first
      # "## [...]" heading (the file's own preamble) is dropped, so the dialog
      # shows this release's section only.
      - name: Read the changelog for this tag
        id: changelog
        shell: bash
        run: |
          file="docs/changelog/changelog-${GITHUB_REF_NAME}.md"
          if [ -f "$file" ] && grep -q '^## \[' "$file"; then
            echo "using $file"
            body=$(sed -n '/^## \[/,$p' "$file")
          else
            echo "$file not found or has no version section - using a generic body"
            body="See the assets below to download and install this version."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$body"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DocCraft ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
